<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="pages/assets/ai.jpg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alexander Kim e-Portfolio</title>
  <!-- <link rel="stylesheet" href="pages/assets/style.css"> -->
<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  background-color: #2c3e50;
}
main {
  background-color:#282E34;
}

header {
  background-color: #2c3e50;
  color: white;
  padding: 20px;
}

h1 {
  margin-top: 0;
}

nav {
  list-style: none;
  margin: 0;
  padding: 0;
}

nav a {
  display: block;
  padding: 10px 20px;
  text-decoration: none;
  color: white;
}

nav a:hover {
  background-color: #3b5972;
}

section {
  margin-top: 20px;
  display:grid;
  place-items:center;
  align-content:center;
  min-height:600px;
  color:white;
}

footer {
  background-color: #2c3e50;
  color: white;
  padding: 20px;
}

.hidden {
	opacity:0;
	filter:blur(5px);
	transition: all 2s;
}

.show {
	opacity:1;
	filter:blur(0px);
}

</style>
</head>
<body>
  <header>
    <h1>Alexander Kim e-Portfolio</h1>
    <nav>
      <a href="home.html">Home</a>
      <a href="pages/about.html">About</a>
      <a href="pages/projects.html">Projects</a>
    </nav>
  </header>
  <main>
    <section>
      <h2 class="hidden" style="font-size:24px">welcome.</h2>
    </section>
	<section>
      <p class="hidden" style="text-align:center;font-size:20px">This website showcases my projects and achievements throughout my student career.<br>Click on the links above to get started.</p>
    </section>
  </main>
  <footer>
    <p>Alexander Kim e-Portfolio 2023</p>
  </footer>
  
<script defer>
const observer = new IntersectionObserver((entries) => {
	entries.forEach((entry) => {
		if (entry.isIntersecting) {
			entry.target.classList.add("show");
		}
	});
});

const hiddenElements = document.querySelectorAll(".hidden");
hiddenElements.forEach((element) => observer.observe(element));
</script>

</body>
</html>
